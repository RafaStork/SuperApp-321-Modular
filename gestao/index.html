<!DOCTYPE html>

<meta name="description" content="Sistema de gestão de tarefas de Engenharia e Indústria — SAC, Vendas, Projetos e Programação de Carregamento." />

<link rel="stylesheet" href="../shared/boot.css?v=20260731-entry-2">
<script src="../shared/theme-bootstrap.js"></script>
<script src="../shared/runtime-config.js"></script>
<script src="../shared/auth.js?v=20260731-auth-safe-1"></script>
<script src="../shared/app-guard.js?v=20260731-entry-2"></script>
<link rel="stylesheet" href="./styles-external.css?v=20260807-progress-4">
<link rel="stylesheet" href="../shared/brand-system.css?v=20260731-layout-2">
<link rel="stylesheet" href="../shared/sidebar-standard.css?v=20260805-5">
<link rel="stylesheet" href="../shared/ui-controls.css?v=20260807-controls-7">
<script src="../shared/ui-controls.js?v=20260807-controls-7" defer></script>


</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-head">
      <img class="brand-logo superapp-brand-logo" id="login-logo" alt="321 Modular" />
      <div><div class="brand-eyebrow">Engenharia &amp; Indústria</div><div class="brand-title">Gestão de Tarefas</div></div>
    </div>
    <form id="login-form">
      <div class="field"><label>E-mail</label><input type="email" id="login-usuario" required autocomplete="username" /></div>
      <div class="field"><label for="login-token">Senha</label><div class="password-field"><input type="password" id="login-token" required autocomplete="current-password" /><button type="button" class="btn btn-ghost password-toggle" id="login-token-toggle" aria-controls="login-token" aria-pressed="false">Mostrar</button></div></div>
      <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
      <div class="error-msg" id="login-error"></div>
    </form>
    <div class="hint">Ambiente local de homologação — autenticação protegida pelo Supabase Auth.</div>
  </div>
</div>

<div id="app-shell">
  <div class="aside-backdrop" id="aside-backdrop"></div>
  <aside id="aside">
    <div class="side-brand">
      <img class="brand-logo superapp-brand-logo" id="side-logo" alt="321 Modular" />
      <div class="brand-name">Gestão de<br>Tarefas</div>
    </div>
    <div class="nav-scroll"><nav class="tabs" id="nav-tabs"></nav></div>
    <div class="side-footer">
      <button class="theme-toggle" id="theme-toggle" type="button" title="Alternar tema"><span class="knob">☀️</span></button>
      <div class="side-session">
        <span class="side-session-copy"><strong class="side-session-name" id="side-user-name">—</strong><small class="side-session-role" id="side-user-role">—</small></span>
        <button class="tab-btn" id="logout-btn" style="justify-content:center;">Sair</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger-btn" id="hamburger-btn" type="button" title="Menu" aria-label="Abrir menu">☰</button>
        <div><h1 class="page-title" id="page-title">—</h1><div class="page-sub" id="page-sub"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn" id="btn-atualizar" type="button" title="Buscar dados mais recentes">⟳ Atualizar</button>
        
      </div>
    </div>
    <div id="view-root"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop" aria-hidden="true"><div class="modal" id="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div></div>
<div id="toast"></div>
<div class="lightbox-backdrop" id="lightbox-backdrop">
  <img id="lightbox-img" src="" alt="Imagem ampliada" />
</div>
<div class="confirm-backdrop" id="confirm-backdrop">
  <div class="confirm-box" id="confirm-box">
    <h3>Confirmar a??o</h3>
    <div id="confirm-mensagem"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="confirm-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="confirm-ok-btn" style="width:auto;background:var(--accent);border-color:var(--accent);">Confirmar</button>
    </div>
  </div>
</div>

<script src="./app.js?v=20260807-progress-4"></script>
</body>
</html>
