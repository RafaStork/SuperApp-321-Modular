<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Ícone Gestão Financeira</title>
  <desc id="desc">Gráfico financeiro ascendente com fundo minimalista e linhas principais totalmente opacas.</desc>
  <rect width="1254" height="1254" fill="#1f331b"/>

  <!-- Fundo minimalista -->
  <g fill="none" stroke="#a7c798" stroke-width="3" opacity="0.22">
    <circle cx="627" cy="627" r="366"/>
    <path d="M282 338V282H338M916 282H972V338M282 916V972H338M916 972H972V916"/>
  </g>

  <!-- Eixos e guia principal sem transparência -->
  <g fill="none" stroke="#a7c798" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 870H925M330 870V376"/>
    <path d="M330 622H925" stroke-dasharray="12 14" opacity="0.9"/>
  </g>

  <!-- Barras -->
  <g stroke="none">
    <path fill="#ed6b1d" d="M372 700H500V870H372Z"/>
    <path fill="#f9b215" d="M563 573H691V870H563Z"/>
    <path fill="#2d5da9" d="M754 432H882V870H754Z"/>
  </g>

  <!-- Seta e topo totalmente sólidos -->
  <g fill="#a7c798">
    <path d="M380 611L558 520L674 552L860 346L895 378L687 608L565 574L399 659Z"/>
    <path d="M817 344H897V424L870 397L844 423L817 396L843 370Z"/>
