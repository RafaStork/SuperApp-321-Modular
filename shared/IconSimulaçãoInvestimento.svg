<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Ícone Crescimento de Investimento</title>
  <desc id="desc">Chalé com barras de crescimento e seta ascendente, representando valorização e investimento.</desc>

  <rect width="1254" height="1254" fill="#1f331b"/>

  <!-- Moldura circular e marcações da linguagem visual existente -->
  <g fill="none" stroke="#a7c798" stroke-linecap="square">
    <circle cx="627" cy="627" r="447" stroke-width="3" opacity="0.72"/>
    <path stroke-width="4" opacity="0.9" d="M203 241V180H264M990 180H1051V241M203 1013V1074H264M990 1074H1051V1013"/>
  </g>

  <!-- Chalé -->
  <path fill="none" stroke="#a7c798" stroke-width="36" stroke-linejoin="miter" stroke-linecap="square" d="M252 817L532 271L752 690"/>

  <!-- Chaminé -->
  <path fill="#a7c798" d="M665 438H706V562L665 487Z"/>
  <rect x="653" y="407" width="67" height="26" fill="#a7c798"/>

  <!-- Porta -->
  <path fill="#ed6b1d" stroke="#a7c798" stroke-width="10" stroke-linejoin="miter" d="M482 637H578V797H482Z"/>

  <!-- Janela iluminada -->
  <g fill="#f9b215">
    <rect x="494" y="495" width="38" height="38" rx="3"/>
    <rect x="548" y="495" width="38" height="38" rx="3"/>
    <rect x="494" y="549" width="38" height="38" rx="3"/>
    <rect x="548" y="549" width="38" height="38" rx="3"/>
  </g>

  <!-- Barras de valorização -->
  <g stroke="none">
    <rect x="478" y="870" width="120" height="125" fill="#ed6b1d"/>
    <rect x="670" y="795" width="120" height="200" fill="#f9b215"/>
    <rect x="854" y="640" width="120" height="355" fill="#2d5da9"/>
  </g>

  <!-- Linha de base do gráfico -->
  <path d="M273 995H986" fill="none" stroke="#a7c798" stroke-width="8" stroke-linecap="round"/>

  <!-- Seta ascendente: ponta em canto, como na imagem de referência -->
  <g fill="none" stroke="#a7c798" stroke-width="36" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M303 963L613 756L723 770L947 492"/>
  </g>
  <path fill="#a7c798" d="M903 444H998V542L959 503L932 481Z"/>
</svg>
